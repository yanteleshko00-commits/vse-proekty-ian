name: NEXORA lobby checks
on:
  pull_request:
    paths:
      - 'nexora/**'
      - '.github/workflows/nexora-lobby-check.yml'
  push:
    branches: [main]
    paths:
      - 'nexora/**'
      - '.github/workflows/nexora-lobby-check.yml'
jobs:
  test-lobby:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd nexora && npm install && npm run check
