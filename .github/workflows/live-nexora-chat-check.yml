name: Live NEXORA Chat acceptance
on:
  push:
    branches: ['test/live-presentation-2026-11-23']
    paths:
      - 'scripts/check-nexora-chat-live.py'
      - '.github/workflows/live-nexora-chat-check.yml'
jobs:
  live-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-nexora-chat-live.py
