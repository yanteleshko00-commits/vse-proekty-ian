name: NEXORA runtime configuration and consistency
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check server.js
          for dir in nexora nexora-image-studio nexora-text-studio nexora-math-studio; do node --check "$dir/server.js"; node --check "$dir/runtime-config.js"; done
          node --check nexora/start.js
          node --check nexora-image-studio/start.js
          node --test test/runtime-config.test.mjs
          node scripts/build-project-css.mjs --check
  studio-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        studio: [nexora-text-studio, nexora-math-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.studio }}
      - run: npm test
        working-directory: ${{ matrix.studio }}
