name: Presentation quality

on:
  push:
    branches: ['fix/presentation-quality-2026-11-23', main]
    paths:
      - 'server.js'
      - 'productDesigner.js'
      - 'presentation-design.js'
      - 'test/presentation-*.test.mjs'
      - '.github/workflows/presentation-quality.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'productDesigner.js'
      - 'presentation-design.js'
      - 'test/presentation-*.test.mjs'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.js && node --check productDesigner.js && node --check presentation-design.js
      - run: node --test test/presentation-*.test.mjs
        env:
          NODE_ENV: test
