name: Container build

on:
  push:
    branches:
      - deploy/container-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vse-proekty-ian:ci

      - name: Test container health and volume persistence
        run: |
          set -eu
          VOLUME=vse-proekty-ian-smoke-volume
          CONTAINER=vse-proekty-ian-smoke
          cleanup() {
            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$VOLUME" >/dev/null
          start_container() {
            docker run -d --name "$CONTAINER" \
              -p 3000:3000 \
              -e PORT=3000 \
              -e GENERATION_JOBS_DIR=/app/data/generation-jobs \
              -v "$VOLUME:/app/data/generation-jobs" \
              vse-proekty-ian:ci
          }
          wait_for_health() {
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
                node -e 'const h = JSON.parse(require("node:fs").readFileSync("/tmp/health.json", "utf8")); if (h.ok !== true || h.generationJobStorageWritable !== true || h.generationJobStorage !== "persistent-disk-mounted") { console.error("Unexpected health response:", h); process.exit(1); }'
                cat /tmp/health.json
                return 0
              fi
              sleep 2
            done
            echo "Container did not become healthy with a mounted volume in 60 seconds."
            return 1
          }

          start_container
          wait_for_health
          JOB_ID=123e4567-e89b-12d3-a456-426614174000
          docker exec "$CONTAINER" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const id = "123e4567-e89b-12d3-a456-426614174000";
            const now = Date.now();
            const job = {
              id, status: "completed", stage: "completed", progress: 100,
              message: "CI recovery test", createdAt: now, updatedAt: now,
              checkpoint: null, artifacts: [],
              result: {
                project: { title: "CI recovery test" },
                files: [], fileErrors: []
              },
              error: null
            };
            fs.writeFileSync(path.join(process.env.GENERATION_JOBS_DIR, id + ".json"), JSON.stringify(job));
          '

          docker rm -f "$CONTAINER" >/dev/null
          start_container
          wait_for_health
          docker exec "$CONTAINER" sh -c 'test -s "/app/data/generation-jobs/$JOB_ID.json"'
          curl --fail --silent "http://127.0.0.1:3000/api/generation-jobs/$JOB_ID" > /tmp/recovered-job.json
          node -e 'const j = JSON.parse(require("node:fs").readFileSync("/tmp/recovered-job.json", "utf8")); if (j.status !== "completed" || j.result?.project?.title !== "CI recovery test") { console.error("Persisted job was not recovered:", j); process.exit(1); }'
          echo "Persisted generation job was recovered after container recreation."
