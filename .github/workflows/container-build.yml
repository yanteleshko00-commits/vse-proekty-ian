name: Container build

on:
  push:
    branches:
      - deploy/container-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vse-proekty-ian:ci

      - name: Run container smoke test
        run: |
          set -eu
          docker run -d --name vse-proekty-ian-smoke \
            -p 3000:3000 \
            -e PORT=3000 \
            -e GENERATION_JOBS_DIR=/app/data/generation-jobs \
            vse-proekty-ian:ci
          cleanup() {
            docker logs vse-proekty-ian-smoke || true
            docker rm -f vse-proekty-ian-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              node -e 'const h = JSON.parse(require("node:fs").readFileSync("/tmp/health.json", "utf8")); if (h.ok !== true || h.generationJobStorageWritable !== true || h.generationJobStorage !== "path-configured-mount-not-detected") { console.error("Unexpected health response:", h); process.exit(1); }'
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in 60 seconds."
          exit 1
