name: Browser Minecraft-like Game Studio fix acceptance
on:
  push:
    branches: ['test/live-presentation-2026-11-23']
    paths:
      - 'scripts/check-nexora-minecraft-browser.mjs'
      - '.github/workflows/live-nexora-minecraft-browser.yml'
jobs:
  minecraft-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core
      - run: node scripts/check-nexora-minecraft-browser.mjs
