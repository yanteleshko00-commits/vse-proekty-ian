name: Mac generator syntax check

on:
  push:
    branches: [mac-local-generator]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check patch whitespace
        run: git diff --check
