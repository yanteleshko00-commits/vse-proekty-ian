name: NEXORA live sites check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-sites-check.yml'
      - 'scripts/check-live-sites.mjs'
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-live-sites.mjs
