<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121526">
<title>Аргоша · помощник NEXORA</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{color:#f8f7ff;background:radial-gradient(ellipse at 13% 0,rgba(100,90,210,.25),transparent 48%),linear-gradient(155deg,#16192b,#0e1221 60%,#17142a);font-weight:650}
.wrap{display:flex;flex-direction:column;height:100dvh;min-height:270px}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid rgba(206,205,250,.1)}
.orb{width:43px;height:43px;flex:0 0 43px;border-radius:50%;position:relative;background:#2950ec;box-shadow:none}
.orb::before,.orb::after{content:"";position:absolute;top:34%;width:18%;height:30.5%;background:#fff;border-radius:50%;transform:rotate(-8deg)}
.orb::before{left:28.5%}.orb::after{right:28.5%;transform:rotate(8deg)}
.orb.busy{animation:thinking 1s ease-in-out infinite}
@keyframes thinking{50%{transform:scale(.92);opacity:.8}}
.header-copy{flex:1;min-width:0}.header-copy strong{display:block;font-size:17px;letter-spacing:-.025em;font-weight:850}.header-copy small{display:block;margin-top:3px;color:#adadd2;font-size:11px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clear{border:1px solid rgba(206,199,255,.16);border-radius:10px;background:rgba(255,255,255,.04);padding:7px 9px;color:#c5c7e4;font-size:11px;white-space:nowrap;cursor:pointer;font-weight:750}
.messages{display:flex;flex-direction:column;gap:11px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:17px 14px 13px;scrollbar-width:thin;scrollbar-color:#4d4b6c transparent}
.message{padding:12px 13px;max-width:91%;border-radius:17px;font-size:13px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid rgba(181,171,237,.12);background:rgba(255,255,255,.075);box-shadow:0 5px 19px rgba(0,0,0,.1);font-weight:630}
.message.assistant{align-self:flex-start;border-bottom-left-radius:5px}
.message.user{align-self:flex-end;border-bottom-right-radius:5px;color:#fff;background:linear-gradient(130deg,#5d76e7,#9365d8);border-color:rgba(255,255,255,.1)}
.message.welcome{border-color:rgba(140,136,241,.2)}
.message .action{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:10px 13px;border-radius:12px;background:linear-gradient(120deg,#657de8,#9772e2);color:white;font-size:11px;font-weight:850;text-decoration:none;max-width:100%}
.message .action:focus-visible{outline:2px solid white;outline-offset:2px}
.message .note{display:block;color:#aaa7c7;font-size:10px;margin-top:9px}
.typing{display:flex;align-items:center;gap:5px}
.typing i{width:6px;height:6px;background:#9d9afb;border-radius:50%;animation:blink 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.3;transform:translateY(-3px)}}
.suggestions{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 13px 11px;flex:0 0 auto}
.suggestions button{flex:0 0 auto;border:1px solid rgba(164,161,236,.24);border-radius:99px;background:rgba(107,117,212,.16);padding:8px 12px;color:#d8d6ff;font-size:10px;font-weight:780;cursor:pointer}
.compose{display:flex;gap:9px;align-items:end;border-top:1px solid rgba(205,199,245,.11);padding:12px 12px max(12px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;min-width:0;max-height:135px;min-height:43px;border:1px solid rgba(170,168,232,.22);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.065);color:#fff;font:650 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;outline:none}
textarea:focus{border-color:#9294f2;box-shadow:0 0 0 3px rgba(139,127,255,.12)}textarea::placeholder{color:#a39fbb}
.send{flex:0 0 43px;height:43px;border:0;border-radius:14px;background:linear-gradient(145deg,#6b8aff,#8665e8);color:white;font-size:22px;font-weight:850;cursor:pointer}
.send:disabled{opacity:.48;cursor:not-allowed}
.footer{padding:0 13px 7px;color:#777d9d;font-size:9px;text-align:center}
@media(max-width:520px){.header{padding:11px 13px 10px}.orb{width:37px;height:37px;flex-basis:37px}.messages{padding:13px 12px}.message{font-size:12px}.compose{padding:10px 10px max(10px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.orb,.orb.busy,.typing i{animation:none!important}}
/* iOS Safari zooms editable fields below 16px. Keep composer fully inside viewport. */
html,body{width:100%;max-width:100%;overscroll-behavior:none}.wrap{height:100%;min-height:0;max-width:100%;overflow:hidden}.header,.suggestions,.compose,.footer{flex-shrink:0;min-width:0;max-width:100%}.messages{min-width:0;overflow-x:hidden}.compose{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:end}#input{width:100%;font-size:16px!important;line-height:1.4;max-height:100px;min-height:44px}.send{width:44px;height:44px}.suggestions{overscroll-behavior-x:contain}.footer{white-space:normal;overflow-wrap:anywhere;line-height:1.35}.wrap:focus-within .suggestions{display:none}@media(max-height:340px){.header{padding:7px 10px}.header-copy small,.footer{display:none}.messages{padding:7px 10px}.compose{padding:7px 10px}}
</style>

</head>
<body>
<div class="wrap">
 <header class="header">
  <div class="orb" id="orb" aria-hidden="true"></div>
  <div class="header-copy"><strong>Аргоша <span aria-hidden="true">✦</span></strong><small id="location">Помощник NEXORA</small></div>
  <button type="button" class="clear" id="clear" title="Очистить текущую беседу">Очистить</button>
 </header>
 <main id="messages" class="messages" aria-live="polite" aria-label="Переписка с Аргошей"></main>
 <div id="suggestions" class="suggestions" aria-label="Быстрые вопросы"></div>
 <form id="compose" class="compose">
  <textarea id="input" rows="1" maxlength="1350" placeholder="Спроси Аргошу…" aria-label="Сообщение Аргоше"></textarea>
  <button type="submit" class="send" id="send" aria-label="Отправить сообщение">↑</button>
 </form>
 <div class="footer">Аргоша может ошибаться. Проверяйте важную информацию.</div>
</div>
<script>
"use strict";
const pages={
 lobby:["NEXORA","Что ты умеешь?","Как сделать проект?","Где создать картинку?"],
 math:["Math Studio","Как прикрепить фото задачи?","Объясни решение по шагам","Помоги с формулой"],
 image:["Image Studio","Улучши мой промпт","Как выбрать стиль?","Как сделать красивое фото?"],
 text:["Text Studio","Как написать сочинение?","Помоги с планом текста","Как загрузить документ?"],
 game:["Game Studio","Как сделать змейку?","Какие механики доступны?","Как скачать игру?"],
 projects:["ВсеПроекты","Как сделать школьный проект?","Сколько слайдов выбрать?","Что написать в требованиях?"]
};
const qs=new URLSearchParams(location.search);
const requested=(qs.get("studio")||"lobby").toLowerCase();
const context=Object.prototype.hasOwnProperty.call(pages,requested)?requested:"lobby";
const info=pages[context];
const $=id=>document.getElementById(id);
$("location").textContent="Помощник · "+info[0];
let history=[],busy=false;
const key="nexora-argosha-"+context+"-v2";
try{
 const loaded=JSON.parse(sessionStorage.getItem(key)||"[]");
 if(Array.isArray(loaded))history=loaded.filter(x=>x&&["user","assistant"].includes(x.role)&&typeof x.content==="string").slice(-10);
}catch{}
function save(){
 try{sessionStorage.setItem(key,JSON.stringify(history.slice(-10)))}catch{}
}
function addMessage(msg,role,action,limited){
 const el=document.createElement("div");
 el.className="message "+role;
 el.textContent=String(msg||"");
 if(action&&action.url&&/^https:\/\/(?:nexora-[a-z-]+|vse-proekty-ian(?:-1)?)\.onrender\.com(?:\/|$)/.test(action.url)){
  const a=document.createElement("a");a.className="action";a.href=action.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=String(action.label||"Открыть инструмент").slice(0,70);el.appendChild(a);
 }
 if(limited){const info=document.createElement("small");info.className="note";info.textContent="Ответ из локальных подсказок. ИИ временно недоступен.";el.appendChild(info)}
 $("messages").appendChild(el);
 $("messages").scrollTop=$("messages").scrollHeight;
 return el;
}
function greeting(){
 const name=info[0];
 if(context==="lobby")return "Привет! Я Аргоша — помощник NEXORA. Помогу выбрать инструмент или разобраться с задачей.";
 return "Привет! Я Аргоша. Сейчас ты в "+name+". Могу объяснить настройки, помочь с идеей или подсказать следующий шаг.";
}
function drawHistory(){
 $("messages").replaceChildren();
 if(!history.length)addMessage(greeting(),"assistant");
 else for(const m of history)addMessage(m.content,m.role);
}
function quick(){
 const node=$("suggestions");node.replaceChildren();
 for(const line of info.slice(1)){
  const b=document.createElement("button");b.type="button";b.textContent=line;b.addEventListener("click",()=>submit(line));node.appendChild(b);
 }
}
async function submit(value){
 const message=String(value||$("input").value||"").trim();
 if(!message||busy)return;
 busy=true;$("send").disabled=true;$("orb").classList.add("busy");
 $("input").value="";$("input").style.height="auto";
 addMessage(message,"user");
 history.push({role:"user",content:message});history=history.slice(-10);save();
 const loader=addMessage("","assistant");
 loader.classList.add("typing");
 const dots=document.createElement("span");dots.className="typing";for(let i=0;i<3;i++){const dot=document.createElement("i");dots.appendChild(dot)}
 loader.appendChild(dots);
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),85000);
 try{
  const response=await fetch("/api/argosha",{
   method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
   body:JSON.stringify({context,messages:history}),signal:controller.signal
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.error||"Не удалось получить ответ Аргоши.");
  loader.remove();
  addMessage(data.reply||"Попробуй уточнить запрос.","assistant",data.action,data.limited);
  history.push({role:"assistant",content:String(data.reply||"").slice(0,2400)});history=history.slice(-10);save();
 }catch(error){
  loader.remove();
  addMessage(error.name==="AbortError"?"Ответ ИИ занял слишком много времени. Попробуй ещё раз.":error.message,"assistant");
 }finally{
  clearTimeout(timeout);busy=false;$("send").disabled=false;$("orb").classList.remove("busy");
  // Do not reopen the iOS keyboard after an asynchronous response.
 }
}
$("compose").addEventListener("submit",event=>{event.preventDefault();void submit()});
$("input").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();void submit()}});
$("input").addEventListener("input",()=>{$("input").style.height="auto";$("input").style.height=Math.min(135,$("input").scrollHeight)+"px"});
$("clear").addEventListener("click",()=>{history=[];save();drawHistory();quick();$("input").focus()});
$("input").addEventListener("focus",()=>{if(parent!==window)parent.postMessage({type:"nx-argosha-focus",focused:true},"*");});$("input").addEventListener("blur",()=>{if(parent!==window)parent.postMessage({type:"nx-argosha-focus",focused:false},"*");});
drawHistory();quick();
</script>
</body>
</html>
