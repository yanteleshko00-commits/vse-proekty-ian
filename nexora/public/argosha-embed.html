<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121526">
<title>Аргоша · помощник NEXORA</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{color:#f8f7ff;background:radial-gradient(ellipse at 13% 0,rgba(100,90,210,.25),transparent 48%),linear-gradient(155deg,#16192b,#0e1221 60%,#17142a);font-weight:650}
.wrap{display:flex;flex-direction:column;height:100dvh;min-height:270px}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid rgba(206,205,250,.1)}
.orb{width:43px;height:43px;flex:0 0 43px;border-radius:50%;position:relative;background:radial-gradient(circle at 31% 23%,#fff,#e2e6ff 9%,#9bd7ff 21%,#737bff 45%,#b870ee 66%,#f2b5a1 85%,#463269);box-shadow:0 0 23px rgba(113,144,255,.5),inset 0 0 1px 2px #ffffff88;animation:pulse 5s ease-in-out infinite}
.orb.busy{animation:thinking 1s ease-in-out infinite}
@keyframes pulse{50%{filter:hue-rotate(25deg);box-shadow:0 0 30px rgba(169,117,255,.7)}}
@keyframes thinking{50%{filter:hue-rotate(65deg);transform:scale(.92)}}
.header-copy{flex:1;min-width:0}.header-copy strong{display:block;font-size:17px;letter-spacing:-.025em;font-weight:850}.header-copy small{display:block;margin-top:3px;color:#adadd2;font-size:11px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clear{border:1px solid rgba(206,199,255,.16);border-radius:10px;background:rgba(255,255,255,.04);padding:7px 9px;color:#c5c7e4;font-size:11px;white-space:nowrap;cursor:pointer;font-weight:750}
.messages{display:flex;flex-direction:column;gap:11px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:17px 14px 13px;scrollbar-width:thin;scrollbar-color:#4d4b6c transparent}
.message{padding:12px 13px;max-width:91%;border-radius:17px;font-size:13px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid rgba(181,171,237,.12);background:rgba(255,255,255,.075);box-shadow:0 5px 19px rgba(0,0,0,.1);font-weight:630}
.message.assistant{align-self:flex-start;border-bottom-left-radius:5px}
.message.user{align-self:flex-end;border-bottom-right-radius:5px;color:#fff;background:linear-gradient(130deg,#5d76e7,#9365d8);border-color:rgba(255,255,255,.1)}
.message.welcome{border-color:rgba(140,136,241,.2)}
.message .action{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:10px 13px;border-radius:12px;background:linear-gradient(120deg,#657de8,#9772e2);color:white;font-size:11px;font-weight:850;text-decoration:none;max-width:100%}
.message .action:focus-visible{outline:2px solid white;outline-offset:2px}
.message .note{display:block;color:#aaa7c7;font-size:10px;margin-top:9px}
.typing{display:flex;align-items:center;gap:5px}
.typing i{width:6px;height:6px;background:#9d9afb;border-radius:50%;animation:blink 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.3;transform:translateY(-3px)}}
.suggestions{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 13px 11px;flex:0 0 auto}
.suggestions button{flex:0 0 auto;border:1px solid rgba(164,161,236,.24);border-radius:99px;background:rgba(107,117,212,.16);padding:8px 12px;color:#d8d6ff;font-size:10px;font-weight:780;cursor:pointer}
.compose{display:flex;gap:9px;align-items:end;border-top:1px solid rgba(205,199,245,.11);padding:12px 12px max(12px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;min-width:0;max-height:135px;min-height:43px;border:1px solid rgba(170,168,232,.22);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.065);color:#fff;font:650 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;outline:none}
textarea:focus{border-color:#9294f2;box-shadow:0 0 0 3px rgba(139,127,255,.12)}textarea::placeholder{color:#a39fbb}
.send{flex:0 0 43px;height:43px;border:0;border-radius:14px;background:linear-gradient(145deg,#6b8aff,#8665e8);color:white;font-size:22px;font-weight:850;cursor:pointer}
.send:disabled{opacity:.48;cursor:not-allowed}
.footer{padding:0 13px 7px;color:#777d9d;font-size:9px;text-align:center}
@media(max-width:520px){.header{padding:11px 13px 10px}.orb{width:37px;height:37px;flex-basis:37px}.messages{padding:13px 12px}.message{font-size:12px}.compose{padding:10px 10px max(10px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.orb,.orb.busy,.typing i{animation:none!important}}
</style>
<style id="nx-result-viewer-style">
.nx-view-open,.nx-view-close{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid currentColor;border-radius:12px;background:transparent;color:inherit;min-height:40px;padding:8px 13px;font:650 13px/1.3 system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.nx-view-open{align-self:flex-end;margin:8px 0 10px}
.nx-view-open[hidden],.nx-view-close[hidden]{display:none!important}
.nx-view-clickable{cursor:zoom-in}
#result-image.nx-view-image{cursor:zoom-in}
.nx-view-expanded{position:fixed!important;inset:0!important;z-index:2147483000!important;box-sizing:border-box!important;width:100%!important;max-width:none!important;height:100dvh!important;max-height:none!important;min-height:0!important;margin:0!important;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))!important;overflow:auto!important;overscroll-behavior:contain;border:0!important;border-radius:0!important;background:var(--bg,#fff)!important;box-shadow:none!important;transform:none!important;isolation:isolate}
.nx-view-expanded>.nx-view-close{position:sticky;top:0;z-index:5;display:flex;margin:0 0 14px auto;background:#292936;color:white;border:0;min-height:44px}
.nx-view-expanded #ai-frame{height:clamp(280px,65dvh,850px)!important;min-height:0!important}
.nx-view-expanded #game{max-height:65dvh;object-fit:contain}
.nx-view-expanded #result-editor,.nx-view-expanded #ai-source{min-height:65dvh}
.nx-gallery{position:fixed;inset:0;width:100%;height:100%;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#08090c;color:#fff;overflow:hidden;z-index:2147483647}
.nx-gallery::backdrop{background:#08090c}
.nx-gallery:not([open]){display:none}
.nx-gallery[open]{display:flex;flex-direction:column;animation:nx-gallery-in .18s ease-out}
.nx-gallery-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));flex-shrink:0;background:#08090c}
.nx-gallery-title{font:650 14px/1.4 system-ui,sans-serif;color:#e4e4eb}
.nx-gallery button{appearance:none;border:0;background:#27282f;color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font:500 26px/1 system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.nx-gallery-stage{position:relative;min-height:0;flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.nx-gallery-photo{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform;pointer-events:none;user-select:none;-webkit-user-drag:none}
.nx-gallery-bottom{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px max(16px,env(safe-area-inset-bottom));flex-shrink:0;background:#08090c}
.nx-gallery-bottom button{font-size:22px}
.nx-gallery-bottom button.nx-gallery-reset{border-radius:22px;width:auto;min-width:72px;padding:0 12px;font-size:14px}
@keyframes nx-gallery-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.nx-gallery[open]{animation:none}}
@media print{.nx-view-open,.nx-view-close,.nx-gallery{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <header class="header">
  <div class="orb" id="orb" aria-hidden="true"></div>
  <div class="header-copy"><strong>Аргоша <span aria-hidden="true">✦</span></strong><small id="location">Помощник NEXORA</small></div>
  <button type="button" class="clear" id="clear" title="Очистить текущую беседу">Очистить</button>
 </header>
 <main id="messages" class="messages" aria-live="polite" aria-label="Переписка с Аргошей"></main>
 <div id="suggestions" class="suggestions" aria-label="Быстрые вопросы"></div>
 <form id="compose" class="compose">
  <textarea id="input" rows="1" maxlength="1350" placeholder="Спроси Аргошу…" aria-label="Сообщение Аргоше"></textarea>
  <button type="submit" class="send" id="send" aria-label="Отправить сообщение">↑</button>
 </form>
 <div class="footer">Аргоша может ошибаться. Проверяйте важную информацию.</div>
</div>
<script>
"use strict";
const pages={
 lobby:["NEXORA","Что ты умеешь?","Как сделать проект?","Где создать картинку?"],
 math:["Math Studio","Как прикрепить фото задачи?","Объясни решение по шагам","Помоги с формулой"],
 image:["Image Studio","Улучши мой промпт","Как выбрать стиль?","Как сделать красивое фото?"],
 text:["Text Studio","Как написать сочинение?","Помоги с планом текста","Как загрузить документ?"],
 game:["Game Studio","Как сделать змейку?","Какие механики доступны?","Как скачать игру?"],
 projects:["ВсеПроекты","Как сделать школьный проект?","Сколько слайдов выбрать?","Что написать в требованиях?"]
};
const qs=new URLSearchParams(location.search);
const requested=(qs.get("studio")||"lobby").toLowerCase();
const context=Object.prototype.hasOwnProperty.call(pages,requested)?requested:"lobby";
const info=pages[context];
const $=id=>document.getElementById(id);
$("location").textContent="Помощник · "+info[0];
let history=[],busy=false;
const key="nexora-argosha-"+context+"-v2";
try{
 const loaded=JSON.parse(sessionStorage.getItem(key)||"[]");
 if(Array.isArray(loaded))history=loaded.filter(x=>x&&["user","assistant"].includes(x.role)&&typeof x.content==="string").slice(-10);
}catch{}
function save(){
 try{sessionStorage.setItem(key,JSON.stringify(history.slice(-10)))}catch{}
}
function addMessage(msg,role,action,limited){
 const el=document.createElement("div");
 el.className="message "+role;
 el.textContent=String(msg||"");
 if(action&&action.url&&/^https:\/\/(?:nexora-[a-z-]+|vse-proekty-ian(?:-1)?)\.onrender\.com(?:\/|$)/.test(action.url)){
  const a=document.createElement("a");a.className="action";a.href=action.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=String(action.label||"Открыть инструмент").slice(0,70);el.appendChild(a);
 }
 if(limited){const info=document.createElement("small");info.className="note";info.textContent="Ответ из локальных подсказок. ИИ временно недоступен.";el.appendChild(info)}
 $("messages").appendChild(el);
 $("messages").scrollTop=$("messages").scrollHeight;
 return el;
}
function greeting(){
 const name=info[0];
 if(context==="lobby")return "Привет! Я Аргоша — помощник NEXORA. Помогу выбрать инструмент или разобраться с задачей.";
 return "Привет! Я Аргоша. Сейчас ты в "+name+". Могу объяснить настройки, помочь с идеей или подсказать следующий шаг.";
}
function drawHistory(){
 $("messages").replaceChildren();
 if(!history.length)addMessage(greeting(),"assistant");
 else for(const m of history)addMessage(m.content,m.role);
}
function quick(){
 const node=$("suggestions");node.replaceChildren();
 for(const line of info.slice(1)){
  const b=document.createElement("button");b.type="button";b.textContent=line;b.addEventListener("click",()=>submit(line));node.appendChild(b);
 }
}
async function submit(value){
 const message=String(value||$("input").value||"").trim();
 if(!message||busy)return;
 busy=true;$("send").disabled=true;$("orb").classList.add("busy");
 $("input").value="";$("input").style.height="auto";
 addMessage(message,"user");
 history.push({role:"user",content:message});history=history.slice(-10);save();
 const loader=addMessage("","assistant");
 loader.classList.add("typing");
 const dots=document.createElement("span");dots.className="typing";for(let i=0;i<3;i++){const dot=document.createElement("i");dots.appendChild(dot)}
 loader.appendChild(dots);
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),85000);
 try{
  const response=await fetch("/api/argosha",{
   method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
   body:JSON.stringify({context,messages:history}),signal:controller.signal
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.error||"Не удалось получить ответ Аргоши.");
  loader.remove();
  addMessage(data.reply||"Попробуй уточнить запрос.","assistant",data.action,data.limited);
  history.push({role:"assistant",content:String(data.reply||"").slice(0,2400)});history=history.slice(-10);save();
 }catch(error){
  loader.remove();
  addMessage(error.name==="AbortError"?"Ответ ИИ занял слишком много времени. Попробуй ещё раз.":error.message,"assistant");
 }finally{
  clearTimeout(timeout);busy=false;$("send").disabled=false;$("orb").classList.remove("busy");
  $("input").focus();
 }
}
$("compose").addEventListener("submit",event=>{event.preventDefault();void submit()});
$("input").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();void submit()}});
$("input").addEventListener("input",()=>{$("input").style.height="auto";$("input").style.height=Math.min(135,$("input").scrollHeight)+"px"});
$("clear").addEventListener("click",()=>{history=[];save();drawHistory();quick();$("input").focus()});
drawHistory();quick();
</script>
<script>(function(){
"use strict";
const settings=[["#messages","panel"]];
let activePanel=null,closePanel=null,savedOverflow="",savedHtmlOverflow="",gallery=null;
function lock(){savedOverflow=document.body.style.overflow;savedHtmlOverflow=document.documentElement.style.overflow;document.body.style.overflow="hidden";document.documentElement.style.overflow="hidden";}
function unlock(){document.body.style.overflow=savedOverflow;document.documentElement.style.overflow=savedHtmlOverflow;}
function button(label,cls,aria){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=label;if(aria)b.setAttribute("aria-label",aria);return b;}
function buildGallery(){
 const dialog=document.createElement("dialog");dialog.className="nx-gallery";dialog.setAttribute("aria-label","Просмотр изображения");
 const top=document.createElement("div");top.className="nx-gallery-top";
 const title=document.createElement("span");title.className="nx-gallery-title";title.textContent="Изображение";
 const close=button("×","","Закрыть изображение");top.append(title,close);
 const stage=document.createElement("div");stage.className="nx-gallery-stage";
 const photo=document.createElement("img");photo.className="nx-gallery-photo";photo.draggable=false;photo.alt="";stage.append(photo);
 const bottom=document.createElement("div");bottom.className="nx-gallery-bottom";
 const minus=button("−","","Уменьшить изображение"),reset=button("100%","nx-gallery-reset","Вернуть исходный размер"),plus=button("+","","Приблизить изображение");bottom.append(minus,reset,plus);dialog.append(top,stage,bottom);document.body.append(dialog);
 let scale=1,x=0,y=0,previous=null,lastTap=null,opener=null,hadMultiple=false,moved=false;
 const points=new Map();
 function clamp(v,min,max){return Math.min(max,Math.max(min,v));}
 function draw(){
  const maxX=Math.max(0,(photo.offsetWidth*scale-stage.clientWidth)/2),maxY=Math.max(0,(photo.offsetHeight*scale-stage.clientHeight)/2);
  x=clamp(x,-maxX,maxX);y=clamp(y,-maxY,maxY);
  photo.style.transform="translate("+x+"px,"+y+"px) scale("+scale+")";reset.textContent=Math.round(scale*100)+"%";minus.disabled=scale<=1;plus.disabled=scale>=5;
 }
 function zoom(value,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const old=scale;scale=clamp(value,1,5);const ratio=scale/old;const px=cx-stage.clientWidth/2,py=cy-stage.clientHeight/2;x=px-(px-x)*ratio;y=py-(py-y)*ratio;draw();}
 function resetZoom(){scale=1;x=0;y=0;draw();}
 function metrics(){const p=[...points.values()];if(p.length>1)return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};return p[0]?{x:p[0].x,y:p[0].y,d:0}:null;}
 function position(e){const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
 stage.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;if(!points.size){moved=false;hadMultiple=false;}points.set(e.pointerId,position(e));if(points.size>1)hadMultiple=true;previous=metrics();try{stage.setPointerCapture(e.pointerId);}catch{}});
 stage.addEventListener("pointermove",e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,position(e));const now=metrics();if(previous&&now){if(Math.hypot(now.x-previous.x,now.y-previous.y)>2)moved=true;if(now.d&&previous.d){zoom(scale*now.d/previous.d,previous.x,previous.y);x+=now.x-previous.x;y+=now.y-previous.y;draw();}else if(scale>1){x+=now.x-previous.x;y+=now.y-previous.y;draw();}}previous=now;});
 function end(e){if(!points.has(e.pointerId))return;const p=position(e);points.delete(e.pointerId);previous=metrics();if(e.type==="pointerup"&&!points.size&&!moved&&!hadMultiple){const now=Date.now();if(lastTap&&now-lastTap.t<320&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<35){zoom(scale>1?1:2.5,p.x,p.y);lastTap=null;}else lastTap={...p,t:now};}}
 stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);stage.addEventListener("lostpointercapture",end);
 stage.addEventListener("wheel",e=>{e.preventDefault();const p=position(e);zoom(scale*Math.exp(-e.deltaY*.002),p.x,p.y);},{passive:false});
 plus.addEventListener("click",()=>zoom(scale*1.4));minus.addEventListener("click",()=>zoom(scale/1.4));reset.addEventListener("click",resetZoom);
 function dismiss(){if(typeof dialog.close==="function")dialog.close();else{dialog.removeAttribute("open");cleanup();}}
 function cleanup(){unlock();points.clear();previous=null;lastTap=null;photo.removeAttribute("src");if(opener?.isConnected)opener.focus({preventScroll:true});opener=null;}
 close.addEventListener("click",dismiss);dialog.addEventListener("close",cleanup);dialog.addEventListener("cancel",e=>{e.preventDefault();dismiss();});photo.addEventListener("load",draw);window.addEventListener("resize",()=>{if(dialog.open)draw();});
 return {open(img){if(dialog.open)return;opener=img;photo.alt=img.alt||"Изображение";photo.src=img.currentSrc||img.src;lock();if(typeof dialog.showModal==="function")dialog.showModal();else dialog.setAttribute("open","");resetZoom();close.focus();},dismiss};
}
function showImage(img){if(!img.currentSrc&&!img.getAttribute("src"))return;if(activePanel&&closePanel)closePanel();if(!gallery)gallery=buildGallery();gallery.open(img);}
function install(){
 for(const [selector,mode] of settings){
  const target=document.querySelector(selector);if(!target)continue;
  if(mode==="image"){
   target.classList.add("nx-view-image");target.tabIndex=0;target.setAttribute("role","button");target.setAttribute("aria-label","Открыть изображение на весь экран");
   target.addEventListener("click",()=>showImage(target));target.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showImage(target);}});continue;
  }
  const open=button("⛶ Развернуть","nx-view-open","Открыть результат на весь экран");
  const close=button("× Закрыть","nx-view-close","Закрыть полноэкранный результат");close.hidden=true;
  target.before(open);target.prepend(close);
  function visible(){open.hidden=!target.getClientRects().length||activePanel===target;}
  function collapse(){if(activePanel!==target)return;target.classList.remove("nx-view-expanded");close.hidden=true;activePanel=null;closePanel=null;unlock();visible();open.focus({preventScroll:true});}
  function expand(){if(activePanel===target)return;if(closePanel)closePanel();lock();activePanel=target;closePanel=collapse;target.classList.add("nx-view-expanded");close.hidden=false;visible();close.focus({preventScroll:true});}
  open.addEventListener("click",expand);close.addEventListener("click",collapse);
  if(mode==="panel"){
   target.classList.add("nx-view-clickable");
   target.addEventListener("click",e=>{const img=e.target.closest("img");if(img&&img.naturalWidth>0){e.preventDefault();showImage(img);return;}if(activePanel===target||e.target.closest("button,a,input,textarea,select,label,[contenteditable],summary")||String(window.getSelection()||"").trim())return;expand();});
  }
  // Game surfaces keep their original DOM and iframe; never intercept gameplay taps.
  if(typeof ResizeObserver!=="undefined"){const ro=new ResizeObserver(visible);ro.observe(target);}
  if(typeof MutationObserver!=="undefined"){const mo=new MutationObserver(visible);for(let el=target;el&&el!==document.body;el=el.parentElement)mo.observe(el,{attributes:true,attributeFilter:["hidden","class","style"]});}
  visible();
 }
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&closePanel)closePanel();});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install,{once:true});else install();
})();</script>
</body>
