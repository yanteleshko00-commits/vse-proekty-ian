<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA · DeepSeek</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1322;color:#ecf1ff;font:16px system-ui;padding:24px}main{max-width:950px;margin:auto}p{color:#9faec8}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile,table{background:#172238;border:1px solid #2a3955;border-radius:16px;padding:16px}.tile span{display:block;color:#9faec8;font-size:13px}.tile strong{display:block;font-size:24px;margin-top:8px}table{width:100%;margin-top:16px;border-collapse:separate;border-spacing:8px}td,th{text-align:left;font-size:13px}button{padding:10px 15px;border:0;border-radius:12px;background:#4166ee;color:white;font:inherit}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#131516;color:#f4f5f4;padding:clamp(16px,4vw,40px)}main{max-width:1080px}h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.045em;line-height:1.08}p,.tile span{color:#b7bdbb;line-height:1.5}.tile,table{background:#1b1e20;border:1px solid #353a3b;border-radius:16px}.tile strong{font-variant-numeric:tabular-nums}button{min-height:44px;background:#caff9d;color:#172018;font-weight:700}button:focus-visible{outline:3px solid white;outline-offset:3px}table{overflow-wrap:anywhere;table-layout:fixed}td,th{font-size:clamp(11px,2vw,13px)}@media(max-width:500px){section{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:12px}.tile strong{font-size:19px}}
</style><main><h1>DeepSeek · статистика NEXORA</h1><p>Фактические данные API за текущий запуск сервера. История прежних запусков в логах Render; остаток пакета не подтверждён поставщиком.</p><button id="refresh">Обновить</button><form method="post" action="/admin/logout" style="display:inline"><button type="submit">Выйти</button></form><p id="status" role="status"></p><section id="cards"></section><table><thead><tr><th>Сервис</th><th>Токены</th><th>Запросы</th><th>Отклонено</th></tr></thead><tbody id="rows"></tbody></table></main><script>const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ru-RU');async function load(){try{const r=await fetch('/api/admin/deepseek',{cache:'no-store'});if(!r.ok)throw Error('Нет доступа');const d=await r.json(),values=Object.values(d.services);$('status').textContent='С '+new Date(d.startedAt).toLocaleString('ru-RU');$('cards').replaceChildren();for(const [label,key] of [['Всего токенов','totalTokens'],['Входные','inputTokens'],['Выходные','outputTokens'],['Запросы без usage','unknown'],['Отклонённые ответы','rejected'],['Проверка недоступна','unreviewed'],['Ошибки API','errors']]){const tile=document.createElement('div');tile.className='tile';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=fmt(values.reduce((n,v)=>n+v[key],0));tile.append(a,b);$('cards').append(tile)}$('rows').replaceChildren();for(const [name,v] of Object.entries(d.services)){const row=document.createElement('tr');for(const value of [name,fmt(v.totalTokens),fmt(v.requests),fmt(v.rejected)]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}$('rows').append(row)}}catch(e){$('status').textContent=e.message}}$('refresh').onclick=load;load();</script></html>
