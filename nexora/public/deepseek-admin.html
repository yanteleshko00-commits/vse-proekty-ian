<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA · DeepSeek</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1322;color:#ecf1ff;font:16px system-ui;padding:24px}main{max-width:950px;margin:auto}p{color:#9faec8}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile,table{background:#172238;border:1px solid #2a3955;border-radius:16px;padding:16px}.tile span{display:block;color:#9faec8;font-size:13px}.tile strong{display:block;font-size:24px;margin-top:8px}table{width:100%;margin-top:16px;border-collapse:separate;border-spacing:8px}td,th{text-align:left;font-size:13px}button{padding:10px 15px;border:0;border-radius:12px;background:#4166ee;color:white;font:inherit}</style><main><h1>DeepSeek · статистика NEXORA</h1><p>Фактические данные API за текущий запуск сервера. История прежних запусков в логах Render; остаток пакета не подтверждён поставщиком.</p><button id="refresh">Обновить</button><form method="post" action="/admin/logout" style="display:inline"><button type="submit">Выйти</button></form><p id="status" role="status"></p><section id="cards"></section><table><thead><tr><th>Сервис</th><th>Токены</th><th>Запросы</th><th>Отклонено</th></tr></thead><tbody id="rows"></tbody></table></main><script>const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ru-RU');async function load(){try{const r=await fetch('/api/admin/deepseek',{cache:'no-store'});if(!r.ok)throw Error('Нет доступа');const d=await r.json(),values=Object.values(d.services);$('status').textContent='С '+new Date(d.startedAt).toLocaleString('ru-RU');$('cards').replaceChildren();for(const [label,key] of [['Всего токенов','totalTokens'],['Входные','inputTokens'],['Выходные','outputTokens'],['Запросы без usage','unknown'],['Отклонённые ответы','rejected'],['Проверка недоступна','unreviewed'],['Ошибки API','errors']]){const tile=document.createElement('div');tile.className='tile';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=fmt(values.reduce((n,v)=>n+v[key],0));tile.append(a,b);$('cards').append(tile)}$('rows').replaceChildren();for(const [name,v] of Object.entries(d.services)){const row=document.createElement('tr');for(const value of [name,fmt(v.totalTokens),fmt(v.requests),fmt(v.rejected)]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}$('rows').append(row)}}catch(e){$('status').textContent=e.message}}$('refresh').onclick=load;load();</script></html>
